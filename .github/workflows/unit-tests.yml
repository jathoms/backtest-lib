name: Unit tests

on:
  push:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "rust/**/*.rs"
      - "rust/Cargo.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "rust/**/*.rs"
      - "rust/Cargo.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/unit-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: pytest
        run: uv run pytest
